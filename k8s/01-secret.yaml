apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: three-tier
  labels:
    app.kubernetes.io/part-of: three-tier-app
    app.kubernetes.io/component: database
type: Opaque
# stringData allows plain-text strings in manifests that Kubernetes
# automatically base64-encodes when creating the secret.
# IMPORTANT: In production, change these default passwords or use external
# secret managers (e.g. HashiCorp Vault, SealedSecrets, AWS Secrets Manager).
stringData:
  MYSQL_ROOT_PASSWORD: "change_root_secure_password"
  MYSQL_USER: "app_user"
  MYSQL_PASSWORD: "change_app_secure_password"
