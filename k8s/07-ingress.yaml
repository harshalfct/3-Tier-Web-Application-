apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: three-tier-ingress
  namespace: three-tier
  labels:
    app.kubernetes.io/part-of: three-tier-app
  annotations:
    # Standard annotations for ingress-nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
spec:
  ingressClassName: nginx
  # Optional: Uncomment and configure if using a domain name or TLS
  # tls:
  #   - hosts:
  #       - app.example.com
  #     secretName: three-tier-tls-secret
  rules:
    # - host: app.example.com  # Optional: specify host if desired
    - http:
        paths:
          # API endpoints routed to Flask backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
          # Health check endpoint routed to Flask backend
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
          # UI and static assets routed to React frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
