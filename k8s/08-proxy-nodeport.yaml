# Standalone Reverse Proxy with NodePort
# Use this alternative if your Kubeadm cluster does NOT have an Ingress Controller (ingress-nginx) installed.
# It exposes the application directly on port 30080 on every Kubernetes node:
# http://<Node-IP>:30080

apiVersion: v1
kind: ConfigMap
metadata:
  name: proxy-nginx-config
  namespace: three-tier
  labels:
    app: proxy
    app.kubernetes.io/part-of: three-tier-app
    app.kubernetes.io/component: proxy
data:
  nginx.conf: |
    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://backend-service:5000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://backend-service:5000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /healthz {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass http://frontend-service:80;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: three-tier
  labels:
    app: proxy
    app.kubernetes.io/part-of: three-tier-app
    app.kubernetes.io/component: proxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
        app.kubernetes.io/part-of: three-tier-app
        app.kubernetes.io/component: proxy
    spec:
      containers:
        - name: proxy
          image: nginx:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: proxy-nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-service
  namespace: three-tier
  labels:
    app: proxy
    app.kubernetes.io/part-of: three-tier-app
    app.kubernetes.io/component: proxy
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
  selector:
    app: proxy
